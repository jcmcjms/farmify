# =============================================================================
# Nginx configuration for Farmify frontend
# Serves the built SPA and proxies API / uploads to the backend
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # ── Static file serving ────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression for performance ───────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── Uploaded files — proxy to backend ──────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large uploads (e.g. verification documents)
        client_max_body_size 50m;
    }

    # ── API requests — proxy to backend ────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── SPA fallback — serve index.html for all other routes ───────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
            expires 6M;
            add_header Cache-Control "public, immutable";
        }
    }
}